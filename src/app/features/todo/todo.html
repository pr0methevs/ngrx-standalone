<h1>Todos List</h1>
@if (todos$ | async; as todos) {
  @if (todos.length > 0) {
    <ul>
      @for (todo of todos; track todo.id) {
        <li>
          {{ todo.title }}
          @if (todo.completed) {
            <span>- Done</span>
          } @else {
            <span>- Not Done</span>
          }
        </li>
      }
    </ul>
  } @else {
    <p>All tasks are completed !</p>
  }
}
